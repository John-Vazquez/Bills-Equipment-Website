<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | Bill's Equipment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
    <link rel="stylesheet" href="styles/products-dynamic.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body id="products" class="catalog-page product-detail-page">
    <header class="title">
        <a href="index.html">
            <img src="Main Images/BE Logo.png" alt="Bill's Equipment & Rentals" class="logo" />
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="products.html" aria-current="page">Products</a></li>
                <li><a href="rentals.html">Rentals</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="nav-login"><a href="admin-login.html">Login</a></li>
            </ul>
        </nav>

        <h1>Products</h1>
    </header>

    <main class="product-detail-main">
        <a class="product-back-link" href="products.html">â† Back to Products</a>

        <section id="productDetailLoading" class="product-detail-state">
            <h2>Loading product...</h2>
        </section>

        <section id="productDetail" class="product-detail-card" hidden>
            <div class="product-detail-gallery">
                <div id="productMainImage" class="product-main-image"></div>
                <div id="productThumbnails" class="product-thumbnails"></div>
            </div>

            <div class="product-detail-info">
                <div id="productDetailBadges" class="product-detail-badges"></div>
                <h2 id="productDetailName"></h2>
                <div id="productDetailPrice" class="product-detail-price"></div>

                <dl id="productMeta" class="product-meta"></dl>

                <div class="product-detail-description">
                    <h3>Description</h3>
                    <p id="productDetailDescription"></p>
                </div>

                <div class="product-detail-actions">
                    <a id="productCallButton" class="catalog-contact-button" href="tel:+19547899459">Call About This Product</a>
                    <a id="productContactButton" class="catalog-secondary-button" href="contact.html">Contact Us</a>
                </div>
            </div>
        </section>

        <section id="productNotFound" class="product-detail-state" hidden>
            <h2>Product not found</h2>
            <p>This listing may have been removed or is no longer public.</p>
            <a class="catalog-contact-button" href="products.html">Browse Products</a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/site-responsive.js" defer></script>
    <script type="module" src="js/product-detail.js"></script>
</body>
</html>
