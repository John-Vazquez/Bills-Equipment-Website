<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rental | Bill's Equipment</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
    <link rel="stylesheet" href="styles/products-dynamic.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body id="rentals" class="catalog-page product-detail-page">
    <header class="title">
        <a href="index.html">
            <img src="Main Images/BE Logo.png" alt="Bill's Equipment & Rentals" class="logo" />
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="rentals.html" aria-current="page">Rentals</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="nav-login"><a href="admin-login.html">Login</a></li>
            </ul>
        </nav>
        <h1>Rentals</h1>
    </header>

    <main class="product-detail-main">
        <a class="product-back-link" href="rentals.html">â† Back to Rentals</a>

        <section id="rentalDetailLoading" class="product-detail-state">
            <h2>Loading rental...</h2>
        </section>

        <section id="rentalDetail" class="product-detail-card" hidden>
            <div class="product-detail-gallery">
                <div id="rentalMainImage" class="product-main-image"></div>
                <div id="rentalThumbnails" class="product-thumbnails"></div>
            </div>

            <div class="product-detail-info">
                <div id="rentalDetailBadges" class="product-detail-badges"></div>
                <h2 id="rentalDetailName"></h2>
                <div id="rentalDetailPrice" class="product-detail-price"></div>
                <dl id="rentalMeta" class="product-meta"></dl>

                <div class="product-detail-description">
                    <h3>Description</h3>
                    <p id="rentalDetailDescription"></p>
                </div>

                <div class="product-detail-actions">
                    <a class="catalog-contact-button" href="tel:+19547899459">Call About This Rental</a>
                    <a class="catalog-secondary-button" href="contact.html">Contact Us</a>
                </div>
            </div>
        </section>

        <section id="rentalNotFound" class="product-detail-state" hidden>
            <h2>Rental not found</h2>
            <p>This rental may have been removed, hidden, or is no longer listed.</p>
            <a class="catalog-contact-button" href="rentals.html">Browse Rentals</a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/site-responsive.js" defer></script>
    <script type="module" src="js/rental-detail.js"></script>
</body>
</html>
