<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Password | Bill's Equipment</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles/admin.css" />
</head>
<body class="admin-auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="reset-title">
      <a class="auth-logo-link" href="index.html">
        <img class="auth-logo" src="Main Images/BE Logo.png" alt="Bill's Equipment" />
      </a>
      <p class="eyebrow">STAFF ACCESS</p>
      <h1 id="reset-title">Choose a New Password</h1>
      <p class="auth-copy">Use at least 10 characters.</p>
      <form id="passwordForm" class="stack-form">
        <label>
          <span>New password</span>
          <input id="newPassword" type="password" minlength="10" autocomplete="new-password" required />
        </label>
        <label>
          <span>Confirm password</span>
          <input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required />
        </label>
        <div id="passwordMessage" class="form-message" role="status" aria-live="polite"></div>
        <button id="passwordButton" class="primary-button" type="submit">Update Password</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
